name: theiaenv
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3
  - build
  - numpy
  - pandas
  - h5py
  - pip
  - pip:
    - nexpy
    - git+http://github.com/nexpy/nexusformat.git
    - nomad-lab[all]
    - metainfoyaml2py
    - structlog
    - nomad-measurements --index-url https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple